<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOD1 validation</title><script src="https://cdn.tailwindcss.com"></script><script src="https://3Dmol.org/build/3Dmol-min.js"></script><style>html,body{min-height:100%;overflow-x:hidden}.viewer-btn{border-color:#cbd5e1}.btn-inactive{background-color:#e5e7eb;color:#374151}button.active{background-color:#1e40af;color:white}button.active.stick-active{background-color:#6b21a8;color:white}.viewer-btn.active{font-weight:800;box-shadow:0 0 0 3px rgba(15,23,42,.2);transform:translateY(-1px)}#btn-reset.active{background:#334155!important;color:#fff;border-color:#334155}#viewer-shell{width:100%;height:520px;min-height:520px;position:relative}#viewer{width:100%;height:100%;min-height:0;position:absolute;inset:0}</style></head>
<body class="bg-slate-50 text-slate-900"><main class="mx-auto max-w-7xl px-4 py-5 sm:px-6 lg:px-8"><header class="mb-5"><p class="text-sm font-semibold text-blue-700">DDLS · Structural validation</p><h1 class="mt-1 text-2xl font-bold leading-tight sm:text-3xl">Human SOD1 model review</h1></header>
<section class="mb-5 rounded-xl border bg-white p-5"><h2 class="text-xl font-bold">Decision</h2><p id="headline" class="mt-3 break-words text-base leading-7 sm:text-lg"></p><p id="check" class="mt-3 break-words leading-6 text-slate-600"></p></section>
<section class="grid items-start gap-5 lg:grid-cols-2"><div class="min-w-0 rounded-xl border bg-white p-4"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="font-bold">Structure · pLDDT</h2><span class="text-sm text-slate-600">Chain A · monomer · 154 aa</span></div><div id="viewer-shell" class="mt-3 w-full overflow-hidden rounded-lg bg-slate-900"><div id="viewer"></div></div><div class="mt-3 flex flex-wrap gap-2"><button id="btn-cartoon" class="viewer-btn btn-inactive active rounded px-3 py-2" onclick="setStyle('cartoon')">Cartoon</button><button id="btn-stick" class="viewer-btn btn-inactive rounded px-3 py-2" onclick="setStyle('stick')">Stick</button><button id="btn-reset" class="viewer-btn btn-inactive rounded px-3 py-2" onclick="setStyle('reset')">Reset</button></div></div>
<div class="min-w-0 space-y-5"><section class="rounded-xl border bg-white p-4"><h2 class="font-bold">Confidence matching the claim</h2><div class="my-3 flex flex-wrap gap-x-5 gap-y-2 text-sm"><span>min <b id="min"></b></span><span>mean <b id="mean"></b></span><span>max <b id="max"></b></span></div><div class="w-full overflow-hidden"><svg id="chart" viewBox="0 0 600 280" class="h-auto w-full rounded border bg-white"></svg></div><p class="mt-3 break-words text-sm leading-6 text-slate-600">Per-residue pLDDT supports local fold confidence. It does not provide confidence for the missing dimer interface.</p></section><section class="rounded-xl border border-amber-200 bg-amber-50 p-5"><h2 class="flex items-center gap-2 font-bold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.8 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"/></svg>Trap to remember</h2><p id="caveat" class="mt-2 break-words leading-6"></p></section></div></section></main>
<script>
let data,viewer;
async function init(){await new Promise(requestAnimationFrame);data=await (await fetch('/api/results')).json();document.querySelector('#headline').textContent="The model supports SOD1's canonical monomeric fold (mean pLDDT 97.93) but does NOT support claims about safe residues in the functional dimer.";document.querySelector('#check').textContent='✓ Sequence: 154 residues, exact match to FASTA. Assembly: Monomer (not functional dimer).';document.querySelector('#caveat').textContent='This AlphaFold model lacks Cu/Zn metal coordination sites. You cannot use it to predict mutation effects in the functional dimer.';for(const k of ['min','mean','max'])document.querySelector('#'+k).textContent=data.plddt[k].toFixed(2);drawChart();const el=document.querySelector('#viewer');if(!el||el.clientWidth===0||el.clientHeight===0)throw new Error('Viewer container has no dimensions');viewer=$3Dmol.createViewer(el,{backgroundColor:'#0f172a',width:el.clientWidth,height:el.clientHeight});const cif=await (await fetch('/structure/SOD1_alphafold_model.cif')).text();viewer.addModel(cif,'cif');viewer.setStyle({}, {cartoon:{colorscheme:{prop:'b',gradient:'roygb',min:70,max:100}}});setStyle('cartoon');viewer.zoomTo();viewer.render();window.addEventListener('resize',()=>{if(viewer){viewer.resize();viewer.zoomTo();viewer.render()}})}
function setStyle(style){const buttons=[document.getElementById('btn-cartoon'),document.getElementById('btn-stick'),document.getElementById('btn-reset')];buttons.forEach(b=>{b.classList.add('btn-inactive');b.classList.remove('active','stick-active')});const selected=document.getElementById('btn-'+style);if(selected){selected.classList.remove('btn-inactive');selected.classList.add('active');if(style==='stick')selected.classList.add('stick-active')}if(style==='reset'){resetView();return}if(!viewer)return;viewer.setStyle({},{});const s={colorscheme:{prop:'b',gradient:'roygb',min:70,max:100}};viewer.setStyle({},style==='cartoon'?{cartoon:s}:{stick:s});viewer.render()}function resetView(){const buttons=[document.getElementById('btn-cartoon'),document.getElementById('btn-stick'),document.getElementById('btn-reset')];buttons.forEach(b=>{b.classList.add('btn-inactive');b.classList.remove('active','stick-active')});document.getElementById('btn-reset').classList.remove('btn-inactive');document.getElementById('btn-reset').classList.add('active');if(viewer){viewer.zoomTo();viewer.render()}}function style3d(kind){setStyle(kind)}
function reset3d(){resetView()}
function drawChart(){const a=data.plddt.residue_values,svg=document.querySelector('#chart');const x=i=>35+i*530/29,y=v=>245-(v-65)*210/40;let path=a.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');svg.innerHTML=`<path d="${path}" fill="none" stroke="#2563eb" stroke-width="3"/><line x1="35" x2="565" y1="113" y2="113" stroke="#94a3b8" stroke-dasharray="4"/><text x="40" y="20" font-size="14">pLDDT · residues 1–30</text><text x="38" y="265" font-size="12">1</text><text x="550" y="265" font-size="12">30</text>`}
init().catch(e=>{document.body.insertAdjacentHTML('beforeend','<p class="p-6 text-red-700">App error: '+e.message+'</p>');console.error(e)});
</script></body></html>
